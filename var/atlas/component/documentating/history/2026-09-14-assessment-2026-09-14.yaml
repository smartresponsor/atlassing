  market validation or deeper non-content runtime testing.
- Assessment is based only on the deterministic repository facts and excerpts embedded
  in the authoritative prompt.
- The repository is documentation-centric, so runtime scoring reflects build and publication
  execution rather than a long-running application service.
- No PHP application manifest or PHPUnit/PHPStan configuration is present; this is
  not treated as a defect because the evidenced implementation is Node, Python, and
  Antora based.
