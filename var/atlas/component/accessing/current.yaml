- Reconcile and commit the intended gating migration.
- Reconcile the pending authentication test changes and additions.
- Run the repository's full lint, coding-standard, PHPStan, PHPUnit, coverage, Panther,
  and applicable Playwright gates on the resulting clean tree.
- Merge the canonical refactor into the intended release branch and create an immutable
  verified RC tag.
- Refresh the Quality Atlas snapshot from that clean tagged commit.
