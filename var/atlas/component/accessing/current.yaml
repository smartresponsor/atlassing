- The assessed HEAD is on refactor/accessing-canonical-structure and has no exact
  release tag.
- The working tree contains modified and untracked authentication tests, so the QA
  baseline is not reproducible from HEAD alone.
- The .gating area contains deleted tracked configuration alongside extensive untracked
  replacement content.
- RC confidence remains dependent on reconciliation and verification of the final
  committed state.
