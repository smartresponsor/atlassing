assessment_notes:
- Commanding has a clear tool-centric producer identity and substantial operational
  scripting, but the current repository state is not RC-ready. Console MCP resolved
  the authoritative workspace on master at ad7c89e38be824f4cf9b54d5ed2c56f8881b26a9.
  The deterministic capture verdict is RED because the repository is heavily dirty,
  including removal of the embedded .commanding projection, large staged .sandbox/vendor
  content, and extensive source changes. The proving application is present under
  .sandbox, but its Composer contract is Symfony 7.3 while repository canon requires
  Symfony 8.x, documentation still describes a root proving application that is not
  present as a root Composer project, and the existing runtime probe on 127.0.0.1:8000
  returned HTTP 404 for /health. No repository mutation, staging, commit, push, restart,
  or destructive operation was performed.
- Execution authority was READ_ONLY, so CMCP_CHANGELOG.md was not initialized or updated
  and no repository files were changed.
- The authoritative specification requires all seven base metric updates and a strict
  assessment response. fileciteturn4file0L25-L142
- The specification explicitly requires metric_updates for product, architecture,
  runtime, qa, ops, market, and overall and requires evidence-grounded narratives.
  fileciteturn4file0L144-L255
