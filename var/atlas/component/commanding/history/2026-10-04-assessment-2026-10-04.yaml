strengths:
- README.md and MANIFEST.md clearly describe Commanding as the producer/source-of-truth
  layer with embedded dot copies as consumer projections.
- commanding.sh and run.sh expose a broad, structured command surface covering tests,
  QA, runtime, data, repository, diagnostics, infrastructure, health, support bundles,
  and agent preparation.
- The reusable .sandbox proving application has App\\ PSR-4 namespace configuration,
  Symfony Console commands, HTTP probe routes, PHPUnit configuration, Doctrine integration,
  and explicit sandbox/watchdog policy documents.
- 'Operational infrastructure is substantial: Docker definitions, health probes, logging
  conventions, Git helpers, runtime menus, and a persistent visual-gallery service
  are present.'
- Console MCP reports the standalone Inspecting engine as available with its native
  analyzer for this repository.
risks:
- Deterministic repository capture is RED with 506 dirty status entries and no HEAD
  change; this prevents an RC-clean assessment.
- The staged index contains a large .sandbox/vendor dependency tree, contrary to the
  repository canon that generated vendor trees should not be part of source analysis
  or committed artifacts.
- The entire tracked .commanding projection is currently deleted while the producer
  scripts are simultaneously undergoing extensive unstaged edits, creating high projection/export
  consistency risk.
- .sandbox/composer.json requires Symfony ^7.3 even though AGENTS.md declares Symfony
  8.x+ as the repository canon.
- README.md and MANIFEST.md describe a root Symfony proving application with root
  composer.json/src/config/tests markers, while the observed repository facts place
  the application under .sandbox and report no root composer.json.
- .sandbox/policy/entrypoints.yaml has structurally suspicious indentation around
  the smoke entrypoint and should be validated before relying on it as an executable
  contract.
- The existing port-8000 runtime was not Console-MCP-managed and answered /health
  with HTTP 404; under REUSE_EXISTING_FIRST it was deliberately not restarted.
- 'QA evidence is shallow for the size of the operational surface: the inspected sandbox
  exposes a basic KernelBootTest and PHPUnit suites, while root PHPStan configuration
  is absent.'
recommended_next_actions:
- 'Reconcile the intended producer/projection transition before RC gating: confirm
  whether deletion of .commanding is deliberate and ensure the export/self-consumption
  contract remains valid.'
- Remove generated .sandbox/vendor content from the intended tracked source set and
  rely on Composer installation/lock state instead.
- Align the proving application with the Symfony 8.x canon or explicitly revise the
  repository canon if Symfony 7.3 is intentionally supported.
- Reconcile README.md and MANIFEST.md with the actual .sandbox application-root contract
  so there is one authoritative proving-app topology.
- Validate and correct .sandbox/policy/entrypoints.yaml, especially the smoke entrypoint
  structure.
- After the dirty transition is coherently settled, run repository-local deterministic
  gates including Composer validation, shell/self-checks, PHPUnit, Symfony container/YAML/router
  checks, and the available Inspecting analysis.
- Probe the intended managed .sandbox runtime again only after identifying the authoritative
  runtime/port; do not restart the unrelated healthy listener merely to satisfy verification.
